<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 3vh, 40px) clamp(20px, 3.5vw, 56px);
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
    }

    video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      mix-blend-mode: screen;
      filter: contrast(1.1);
      border: none;
      outline: none;
      background: transparent;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    video.active {
      opacity: 1;
      z-index: 2;
    }
  </style>
</head>

<body>
  <div class="stage">
    <video id="video-a" class="active" autoplay muted playsinline preload="auto"></video>
    <video id="video-b" muted playsinline preload="auto"></video>
  </div>
  <script>
    const playlist = [
      'mirage-ascii-ezgif.com-gif-to-mp4-converter.webm',
      'mirage-ascii-Lain-ezgif.com-gif-to-mp4-converter.webm',
      'mirage-ascii-ezgif.com-gif-to-mp4-converter(1).webm'
    ];

    const players = [
      document.getElementById('video-a'),
      document.getElementById('video-b')
    ];

    const preloadPromises = new Map();
    let activePlayerIdx = 0;
    let currentTrackIdx = 0;
    let standbySeq = 0;
    let isSwitching = false;
    let errorCount = 0;

    function preloadTrack(trackIdx) {
      if (preloadPromises.has(trackIdx)) {
        return preloadPromises.get(trackIdx);
      }

      const url = playlist[trackIdx];
      const promise = fetch(url)
        .then((response) => {
          if (!response.ok) throw new Error('Failed to fetch video');
          return response.blob();
        })
        .then((blob) => URL.createObjectURL(blob))
        .catch(() => url);

      preloadPromises.set(trackIdx, promise);
      return promise;
    }

    async function prepareStandby(player, trackIdx) {
      const seq = ++standbySeq;
      const src = await preloadTrack(trackIdx);
      if (seq !== standbySeq) return;

      player.dataset.trackIdx = String(trackIdx);
      player.src = src;
      player.load();
    }

    async function switchToNext() {
      if (isSwitching) return;
      isSwitching = true;

      const nextTrackIdx = (currentTrackIdx + 1) % playlist.length;
      const nextPlayerIdx = 1 - activePlayerIdx;
      const currentPlayer = players[activePlayerIdx];
      const nextPlayer = players[nextPlayerIdx];

      if (nextPlayer.dataset.trackIdx !== String(nextTrackIdx)) {
        standbySeq += 1;
        nextPlayer.dataset.trackIdx = String(nextTrackIdx);
        nextPlayer.src = await preloadTrack(nextTrackIdx);
        nextPlayer.load();
      }

      if (nextPlayer.currentTime > 0) {
        nextPlayer.currentTime = 0;
      }

      try {
        await nextPlayer.play();
      } catch (_) { }

      requestAnimationFrame(() => {
        nextPlayer.classList.add('active');
        currentPlayer.classList.remove('active');
        currentPlayer.pause();
        currentPlayer.dataset.trackIdx = '';

        activePlayerIdx = nextPlayerIdx;
        currentTrackIdx = nextTrackIdx;
        isSwitching = false;

        prepareStandby(currentPlayer, (currentTrackIdx + 1) % playlist.length);
      });
    }

    players.forEach((player, idx) => {
      player.addEventListener('loadeddata', () => {
        if (idx === activePlayerIdx) {
          errorCount = 0;
        }
      });

      player.addEventListener('ended', () => {
        if (idx === activePlayerIdx) {
          switchToNext();
        }
      });

      player.addEventListener('error', () => {
        if (idx === activePlayerIdx) {
          errorCount += 1;
          if (errorCount < playlist.length) {
            switchToNext();
          }
        }
      });
    });

    players[0].dataset.trackIdx = '0';
    players[0].src = playlist[0];
    players[0].play().catch(() => { });

    prepareStandby(players[1], 1);
    preloadTrack(2);
    preloadTrack(0);
  </script>
</body>

</html>
