<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 3vh, 40px) clamp(20px, 3.5vw, 56px);
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      mix-blend-mode: screen;
      filter: contrast(1.1);
      border: none;
      outline: none;
      background: transparent;
    }
  </style>
</head>

<body>
  <video id="player" src="mirage-ascii-ezgif.com-gif-to-mp4-converter.webm" autoplay muted playsinline></video>
  <script>
    const playlist = [
      'mirage-ascii-ezgif.com-gif-to-mp4-converter.webm',
      'mirage-ascii-Lain-ezgif.com-gif-to-mp4-converter.webm',
      'mirage-ascii-ezgif.com-gif-to-mp4-converter(1).webm'
    ];

    const player = document.getElementById('player');
    let currentIndex = 0;
    let errorCount = 0;

    function playNext() {
      currentIndex = (currentIndex + 1) % playlist.length;
      player.src = playlist[currentIndex];
      player.play().catch(() => { });
    }

    player.addEventListener('loadeddata', () => {
      errorCount = 0;
    });

    player.addEventListener('ended', playNext);
    player.addEventListener('error', () => {
      errorCount += 1;
      if (errorCount < playlist.length) {
        playNext();
      }
    });
  </script>
</body>

</html>
